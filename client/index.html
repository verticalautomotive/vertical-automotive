    <!--
      GTM DELAYED LOADING STRATEGY
      ─────────────────────────────
      GTM (~810ms execution) is loaded ONLY after the first user interaction
      (scroll, click, touch, or keydown) OR after 5 seconds via requestIdleCallback.
      This ensures GTM never blocks FCP/LCP on initial page load.

      Conversion tracking is preserved: GTM fires 'gtm.js' event as normal once loaded.
      The dataLayer is pre-initialized so any pushes before GTM loads are queued.
    -->
    <script>
      // Pre-initialize dataLayer so any early pushes are queued before GTM loads.
      // IMPORTANT: Do NOT push gtm.start here — that must happen inside loadGTM()
      // after the script tag is created, so GTM's own init code can read it.
      window.dataLayer = window.dataLayer || [];

      (function() {
        var GTM_ID = 'GTM-5Q5RPRR4';
        var loaded = false;

        function loadGTM() {
          if (loaded) return;
          loaded = true;

          // Inject GTM script first, THEN push gtm.start.
          // This avoids GTM reading layout geometry synchronously during the push.
          // Using requestAnimationFrame ensures this runs AFTER first paint,
          // preventing forced reflow during the critical rendering path.
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
          s.async = true;
          // Push gtm.start only after the script has been appended to DOM
          // and after the browser has had a chance to paint the first frame.
          s.addEventListener('load', function() {
            // GTM script loaded — nothing extra needed here,
            // gtm.js handles its own initialization internally.
          });
          document.head.appendChild(s);

          // Push gtm.start in the next animation frame to avoid forced reflow
          // during the current layout/paint cycle.
          requestAnimationFrame(function() {
            window.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});
          });
        }

        // Load on first user interaction (mousemove removed — it fires immediately
        // on desktop when cursor is over the page, defeating the deferred strategy)
        var events = ['scroll', 'click', 'touchstart', 'keydown'];
        function onInteraction() {
          loadGTM();
          events.forEach(function(e) {
            document.removeEventListener(e, onInteraction, {passive: true});
          });
        }
        events.forEach(function(e) {
          document.addEventListener(e, onInteraction, {passive: true, once: true});
        });

        // Fallback: load after 5 seconds via requestIdleCallback (or setTimeout).
        // 5s ensures React has fully hydrated before GTM's ~1.3s of scripting begins.
        var fallback = function() { loadGTM(); };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(fallback, {timeout: 5000});
        } else {
          setTimeout(fallback, 5000);
        }
      })();
    </script>
